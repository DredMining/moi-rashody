<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101216">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <title>iPhone 17 Pro Max — Silver</title>
  <style>
    :root {
      color-scheme: dark;
      --stage: #101216;
      --screen: #0d1320;
      --silver-light: #f7f8f7;
      --silver-mid: #b9bec1;
      --silver-dark: #707579;
      --device-width: 462px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      margin: 0;
    }

    body {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      padding: clamp(8px, 1.2vh, 14px) clamp(10px, 2.2vw, 24px);
      gap: 6px;
      background:
        radial-gradient(ellipse at 50% 44%, rgb(74 82 95 / 25%), transparent 43%),
        radial-gradient(ellipse at 50% 110%, rgb(0 0 0 / 72%), transparent 55%),
        linear-gradient(145deg, #1b1e23, var(--stage) 58%, #0b0c0e);
      color: #f8f9fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    .simulator-toolbar {
      z-index: 10;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      width: min(100%, 978px);
      min-height: 40px;
    }

    .refresh-mode {
      margin-right: auto;
      padding-left: 4px;
      color: rgb(216 222 230 / 72%);
      font-size: 11px;
      line-height: 1.2;
      white-space: nowrap;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tool-button {
      min-width: 40px;
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 12px;
      border: 1px solid rgb(220 225 230 / 25%);
      border-radius: 999px;
      background: linear-gradient(180deg, rgb(255 255 255 / 13%), rgb(255 255 255 / 5%));
      box-shadow: 0 2px 8px rgb(0 0 0 / 25%), inset 0 1px 0 rgb(255 255 255 / 16%);
      color: #f4f6f8;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    .tool-button:hover { border-color: rgb(240 244 248 / 55%); background-color: rgb(255 255 255 / 8%); }
    .tool-button:active { transform: translateY(1px) scale(.98); }
    .tool-button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    .tool-button[aria-pressed="true"] { border-color: rgb(182 205 255 / 75%); background-color: rgb(92 137 232 / 24%); }
    .tool-button svg { width: 17px; height: 17px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    #refreshApp[data-pending="true"] { border-color: #f4c76a; color: #ffe5a7; }

    .stage {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      place-items: center;
      width: min(100%, 1026px);
    }

    .phone {
      position: relative;
      isolation: isolate;
      container-type: inline-size;
      flex: none;
      width: min(var(--device-width), calc(100vw - 24px), calc(47.24vh - 41.57px));
      aspect-ratio: 462 / 978;
      border-radius: clamp(28px, 13%, 62px);
      animation: device-arrive 620ms cubic-bezier(.18, .8, .2, 1) both;
      background:
        linear-gradient(118deg, transparent 0 2.6%, rgb(255 255 255 / 82%) 3%, rgb(255 255 255 / 18%) 3.35%, transparent 4.2% 65%, rgb(255 255 255 / 22%) 77%, transparent 89%),
        linear-gradient(90deg,
          #5f6468 0%, #c8ccce 1.6%, #f7f8f7 3.2%, #a2a7aa 5.2%, #f6f7f6 11%,
          #d7dadb 16%, #9da2a5 42%, #e9ebea 68%, #aeb3b6 84%, #f2f3f2 94%, #686d71 100%),
        linear-gradient(180deg, #f6f7f6, #8e9397 48%, #eff0ef);
      box-shadow:
        0 32px 68px rgb(0 0 0 / 62%),
        0 9px 24px rgb(0 0 0 / 42%),
        0 2px 5px rgb(0 0 0 / 78%),
        inset 0 1px 1px rgb(255 255 255 / 98%),
        inset 0 -2px 6px rgb(33 37 40 / 78%);
    }

    @keyframes device-arrive {
      from { opacity: 0; transform: translateY(10px) scale(.965); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .phone.is-landscape {
      width: min(978px, calc(100vw - 42px), calc(211.69vh - 152.42px));
      aspect-ratio: 978 / 462;
      border-radius: 62px;
    }

    .phone::before {
      position: absolute;
      z-index: 4;
      inset: 2px;
      border: 1px solid rgb(255 255 255 / 66%);
      border-radius: inherit;
      box-shadow:
        inset 0 0 0 1px rgb(71 76 80 / 48%),
        inset 0 2px 4px rgb(255 255 255 / 72%),
        inset 0 -3px 8px rgb(48 52 56 / 46%);
      content: "";
      pointer-events: none;
    }

    .phone::after {
      position: absolute;
      z-index: 0;
      inset: 4px;
      border: 1px solid rgb(68 73 77 / 42%);
      border-radius: inherit;
      background: linear-gradient(142deg, rgb(255 255 255 / 23%), transparent 9% 87%, rgb(255 255 255 / 12%));
      content: "";
      pointer-events: none;
    }

    .screen {
      position: absolute;
      z-index: 1;
      inset: 8px;
      overflow: hidden;
      container-type: size;
      border: 1px solid rgb(18 20 22 / 86%);
      border-radius: clamp(24px, calc(13cqi - 8px), 52px);
      background: var(--screen);
      box-shadow:
        inset 0 0 0 1px rgb(255 255 255 / 10%),
        inset 0 2px 7px rgb(0 0 0 / 55%),
        0 0 0 1px rgb(59 64 68 / 62%),
        0 1px 5px rgb(0 0 0 / 55%);
    }

    .app-frame {
      position: absolute;
      z-index: 1;
      top: 0;
      left: 0;
      display: block;
      width: 440px;
      height: 956px;
      transform: scale(var(--frame-scale, 1));
      transform-origin: top left;
      border: 0;
      background: var(--screen);
      color-scheme: light dark;
    }

    .phone.is-landscape .app-frame { width: 956px; height: 440px; }

    .status-bar {
      position: absolute;
      z-index: 5;
      inset: 0;
      color: #f8f9fa;
      pointer-events: none;
      user-select: none;
    }

    .status-time {
      position: absolute;
      top: 1.72%;
      left: 6.6%;
      font-size: 12px;
      font-size: 2.75cqi;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .status-icons {
      position: absolute;
      top: 1.57%;
      right: 6.1%;
      display: flex;
      align-items: center;
      gap: 1.15cqi;
      height: 12px;
      height: 2.65cqi;
      color: currentColor;
    }

    .status-icons svg {
      display: block;
      width: auto;
      height: 100%;
      overflow: visible;
    }

    .signal-icon {
      aspect-ratio: 18 / 14;
    }

    .wifi-icon {
      aspect-ratio: 17 / 14;
    }

    .battery-icon {
      aspect-ratio: 25 / 14;
    }

    .dynamic-island {
      position: absolute;
      z-index: 6;
      top: 1.1%;
      left: 50%;
      width: 26.3%;
      height: 3.55%;
      padding: 0;
      transform: translateX(-50%);
      border: 0;
      border-radius: 999px;
      background: #000;
      box-shadow:
        inset 0 1px 1px rgb(255 255 255 / 9%),
        0 0 0 1px rgb(0 0 0 / 35%);
      cursor: pointer;
      transition:
        width 260ms cubic-bezier(.2, .8, .2, 1),
        height 260ms cubic-bezier(.2, .8, .2, 1),
        box-shadow 260ms ease,
        transform 180ms ease;
      will-change: width, height, box-shadow;
      -webkit-tap-highlight-color: transparent;
    }

    .dynamic-island:active { transform: translateX(-50%) scale(.96); }

    .dynamic-island.island-pulse { animation: island-pulse 440ms ease-out; }

    @keyframes island-pulse {
      0% { box-shadow: inset 0 1px 1px rgb(255 255 255 / 9%), 0 0 0 1px rgb(0 0 0 / 35%); }
      48% { box-shadow: inset 0 1px 1px rgb(255 255 255 / 15%), 0 0 0 2px rgb(255 255 255 / 30%), 0 0 18px rgb(197 214 255 / 30%); }
      100% { box-shadow: inset 0 1px 1px rgb(255 255 255 / 9%), 0 0 0 1px rgb(0 0 0 / 35%); }
    }

    .dynamic-island[aria-expanded="true"] {
      width: 41%;
      height: 4.05%;
      box-shadow:
        inset 0 1px 1px rgb(255 255 255 / 9%),
        0 0 0 1px rgb(0 0 0 / 45%),
        0 4px 12px rgb(0 0 0 / 24%);
    }

    .dynamic-island:focus-visible {
      outline: 2px solid rgb(255 255 255 / 86%);
      outline-offset: 3px;
    }

    .home-indicator {
      position: absolute;
      z-index: 5;
      bottom: 1.27%;
      left: 50%;
      width: 27.3%;
      height: 0.53%;
      min-height: 3px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: #f7f7f7;
      mix-blend-mode: difference;
      pointer-events: none;
    }

    .phone.is-landscape .status-time {
      top: 3.7%;
      left: 1.7%;
      font-size: 2.75cqh;
    }

    .phone.is-landscape .status-icons {
      top: 3.4%;
      right: 1.7%;
      gap: 1.15cqh;
      height: 2.65cqh;
    }

    .phone.is-landscape .dynamic-island {
      top: 50%;
      left: 1.1%;
      width: 3.55%;
      height: 26.3%;
      transform: translateY(-50%);
    }

    .phone.is-landscape .dynamic-island:active { transform: translateY(-50%) scale(.96); }

    .phone.is-landscape .dynamic-island[aria-expanded="true"] { width: 4.05%; height: 41%; }

    .phone.is-landscape .home-indicator {
      top: 50%;
      right: 1.27%;
      bottom: auto;
      left: auto;
      width: 0.53%;
      height: 27.3%;
      min-width: 3px;
      min-height: 0;
      transform: translateY(-50%);
    }

    .hardware-button {
      position: absolute;
      z-index: 2;
      width: 0.9cqi;
      border: 1px solid rgb(75 80 84 / 68%);
      background: linear-gradient(90deg, #666b6f 0%, #d6d9da 22%, #fbfcfb 43%, #a5aaad 74%, #74797d 100%);
      box-shadow:
        inset 0 1px 0 rgb(255 255 255 / 80%),
        inset 0 -1px 1px rgb(35 39 42 / 35%),
        0 1px 2px rgb(0 0 0 / 50%);
      pointer-events: none;
    }

    .hardware-button::before {
      position: absolute;
      inset: 2px 1px auto;
      height: 1px;
      background: rgb(255 255 255 / 68%);
      content: "";
    }

    .hardware-button.left {
      left: -4px;
      left: -0.65cqi;
      border-radius: 4px 0 0 4px;
    }

    .hardware-button.right {
      right: -4px;
      right: -0.65cqi;
      border-radius: 0 4px 4px 0;
      background: linear-gradient(270deg, #777c80, #f6f7f6 42%, #9ea3a6 100%);
    }

    .action-button {
      top: 17.6%;
      height: 4.3%;
    }

    .volume-up {
      top: 25.2%;
      height: 7.1%;
    }

    .volume-down {
      top: 34.1%;
      height: 7.1%;
    }

    .side-button {
      top: 25.8%;
      height: 11.2%;
    }

    .camera-control {
      top: 40.5%;
      height: 5.4%;
    }

    .phone.is-landscape .hardware-button.left,
    .phone.is-landscape .hardware-button.right {
      top: auto;
      right: auto;
      bottom: auto;
      left: auto;
      width: auto;
      height: 0.9cqh;
      border-radius: 4px 4px 0 0;
    }

    .phone.is-landscape .hardware-button.left { top: -0.65cqh; }
    .phone.is-landscape .hardware-button.right {
      bottom: -0.65cqh;
      border-radius: 0 0 4px 4px;
      background: linear-gradient(270deg, #666b6f 0%, #d6d9da 22%, #fbfcfb 43%, #a5aaad 74%, #74797d 100%);
    }

    .phone.is-landscape .action-button { left: 17.6%; width: 4.3%; height: 0.9cqh; }
    .phone.is-landscape .volume-up { left: 25.2%; width: 7.1%; height: 0.9cqh; }
    .phone.is-landscape .volume-down { left: 34.1%; width: 7.1%; height: 0.9cqh; }
    .phone.is-landscape .side-button { left: 25.8%; width: 11.2%; height: 0.9cqh; }
    .phone.is-landscape .camera-control { left: 40.5%; width: 5.4%; height: 0.9cqh; }

    @media (max-width: 420px) {
      .refresh-mode { display: none; }
      .tool-button { width: 40px; padding-inline: 0; }
      .tool-button .toolbar-label { display: none; }
    }

    @media (max-height: 480px) {
      .phone:not(.is-landscape) { width: min(var(--device-width), calc(100vw - 24px), calc(47.24vh - 34.01px)); }
      .phone.is-landscape { width: min(978px, calc(100vw - 42px), calc(211.69vh - 131.82px)); }
      .simulator-toolbar { min-height: 34px; }
      .tool-button { min-height: 32px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }

    @supports (height: 100dvh) {
      .phone {
        width: min(var(--device-width), calc(100vw - 24px), calc(47.24dvh - 41.57px));
      }
      .phone.is-landscape {
        width: min(978px, calc(100vw - 42px), calc(211.69dvh - 152.42px));
      }
      @media (max-height: 480px) {
        .phone:not(.is-landscape) { width: min(var(--device-width), calc(100vw - 24px), calc(47.24dvh - 34.01px)); }
        .phone.is-landscape { width: min(978px, calc(100vw - 42px), calc(211.69dvh - 131.82px)); }
      }
    }
  </style>
</head>
<body>
  <div class="simulator-toolbar" role="toolbar" aria-label="Управление симулятором">
    <span class="refresh-mode" id="refreshMode" role="status" aria-live="polite"></span>
    <div class="toolbar-actions">
      <button class="tool-button" id="refreshApp" type="button" title="Обновить приложение в телефоне" aria-label="Обновить приложение в телефоне" data-pending="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5"/><path d="M19 12a7 7 0 1 1-2-4.9L20 12"/></svg>
        <span class="toolbar-label">Обновить</span>
      </button>
      <button class="tool-button" id="orientationToggle" type="button" aria-pressed="false" aria-label="Переключить в альбомную ориентацию" title="Переключить ориентацию телефона">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="2.5" width="11" height="19" rx="2.3"/><path d="M10 5h4M11 18.5h2"/></svg>
        <span class="toolbar-label" id="orientationLabel">Портретная</span>
      </button>
    </div>
  </div>

  <div class="stage" id="deviceStage">
  <main class="phone" id="phone" aria-label="Симулятор iPhone 17 Pro Max Silver, портретная ориентация">
    <span class="hardware-button left action-button" aria-hidden="true"></span>
    <span class="hardware-button left volume-up" aria-hidden="true"></span>
    <span class="hardware-button left volume-down" aria-hidden="true"></span>
    <span class="hardware-button right side-button" aria-hidden="true"></span>
    <span class="hardware-button right camera-control" aria-hidden="true"></span>

    <div class="screen">
      <iframe
        class="app-frame"
        src="./index.html"
        title="Приложение «Мои расходы»"
        loading="eager"
      ></iframe>

      <div class="status-bar" aria-hidden="true">
        <time class="status-time" id="statusTime">--:--</time>
        <div class="status-icons">
          <svg class="signal-icon" viewBox="0 0 18 14" aria-hidden="true">
            <path fill="currentColor" d="M1 12.7h2.6V10H1zm4 0h2.6V7.7H5zm4 0h2.6V5.2H9zm4 0h2.6V2.7H13zm4 0h.8V.4H17z" />
          </svg>
          <svg class="wifi-icon" viewBox="0 0 17 14" aria-hidden="true">
            <path fill="currentColor" d="M8.5 10.8a1.55 1.55 0 1 0 0 3.1 1.55 1.55 0 0 0 0-3.1ZM.5 4.9l1.6 1.6a9.1 9.1 0 0 1 12.8 0l1.6-1.6a11.35 11.35 0 0 0-16 0Zm3.1 3.1 1.6 1.6a4.75 4.75 0 0 1 6.6 0l1.6-1.6a7 7 0 0 0-9.8 0Z" />
          </svg>
          <svg class="battery-icon" viewBox="0 0 25 14" aria-hidden="true">
            <rect x=".7" y="1.2" width="20" height="11.6" rx="3" fill="none" stroke="currentColor" stroke-width="1.4" />
            <rect x="2.7" y="3.2" width="14.8" height="7.6" rx="1.5" fill="currentColor" />
            <path fill="currentColor" d="M22.2 4.4h1.1c.7 0 1.2.6 1.2 1.3v2.6c0 .7-.5 1.3-1.2 1.3h-1.1z" />
          </svg>
        </div>
      </div>

    <button
      class="dynamic-island"
      type="button"
      aria-label="Расширить Dynamic Island"
      aria-expanded="false"
      title="Нажмите, чтобы анимировать Dynamic Island"
    ></button>

    <div class="home-indicator" aria-hidden="true"></div>
  </div>
  </main>
  </div>

  <script>
    (() => {
      const clock = document.getElementById("statusTime");
      const island = document.querySelector(".dynamic-island");
      const frame = document.querySelector(".app-frame");
      const screen = document.querySelector(".screen");
      const phone = document.getElementById("phone");
      const orientationToggle = document.getElementById("orientationToggle");
      const orientationLabel = document.getElementById("orientationLabel");
      const refreshButton = document.getElementById("refreshApp");
      const refreshMode = document.getElementById("refreshMode");
      const isLandscape = () => phone.classList.contains("is-landscape");
      let sourceSignature = "";

      const frameSize = () => isLandscape()
        ? { width: 956, height: 440 }
        : { width: 440, height: 956 };

      const resizeFrame = () => {
        const { width, height } = frameSize();
        const scale = Math.min(screen.clientWidth / width, screen.clientHeight / height);
        const left = Math.max(0, (screen.clientWidth - width * scale) / 2);
        const top = Math.max(0, (screen.clientHeight - height * scale) / 2);
        frame.style.width = `${width}px`;
        frame.style.height = `${height}px`;
        frame.style.left = `${left}px`;
        frame.style.top = `${top}px`;
        frame.style.setProperty("--frame-scale", String(Math.max(0, scale)));
      };

      const setOrientation = (landscape) => {
        phone.classList.toggle("is-landscape", landscape);
        phone.setAttribute(
          "aria-label",
          `Симулятор iPhone 17 Pro Max Silver, ${landscape ? "альбомная" : "портретная"} ориентация`
        );
        orientationToggle.setAttribute("aria-pressed", String(landscape));
        orientationToggle.setAttribute(
          "aria-label",
          `Переключить в ${landscape ? "портретную" : "альбомную"} ориентацию`
        );
        orientationLabel.textContent = landscape ? "Альбомная" : "Портретная";
        void screen.offsetWidth;
        resizeFrame();
        requestAnimationFrame(resizeFrame);
      };

      if ("ResizeObserver" in window) {
        new ResizeObserver(resizeFrame).observe(screen);
      } else {
        window.addEventListener("resize", resizeFrame);
      }
      resizeFrame();

      orientationToggle.addEventListener("click", () => setOrientation(!isLandscape()));

      const updateClock = () => {
        clock.textContent = new Intl.DateTimeFormat(undefined, {
          hour: "2-digit",
          minute: "2-digit",
          hourCycle: "h23"
        }).format(new Date());
      };

      updateClock();
      window.setInterval(updateClock, 30_000);

      island.addEventListener("click", () => {
        const expanded = island.getAttribute("aria-expanded") !== "true";
        island.setAttribute("aria-expanded", String(expanded));
        island.setAttribute(
          "aria-label",
          expanded ? "Свернуть Dynamic Island" : "Расширить Dynamic Island"
        );
        island.classList.remove("island-pulse");
        void island.offsetWidth;
        island.classList.add("island-pulse");
        window.setTimeout(() => island.classList.remove("island-pulse"), 460);
      });

      const defaultRefreshTitle = location.protocol === "file:"
        ? "Обновить iframe вручную. file:// не сообщает странице об изменениях файла."
        : "Обновить приложение в телефоне";
      const reloadFrame = () => {
        let url;
        try {
          url = new URL(frame.contentWindow.location.href);
        } catch {
          url = new URL("./index.html", location.href);
        }
        url.searchParams.set("simulator-refresh", String(Date.now()));
        frame.src = url.href;
        refreshButton.dataset.pending = "false";
        refreshButton.title = defaultRefreshTitle;
        refreshButton.setAttribute("aria-label", "Обновить приложение в телефоне");
      };

      const safeToReload = () => {
        try {
          const doc = frame.contentDocument;
          if (!doc) return false;
          if (doc.querySelector("#sheet:not([hidden]), #zakatSheet:not([hidden]), .wmodal:not([hidden])")) return false;
          if (doc.activeElement?.matches("input, textarea, select")) return false;
          return ![...doc.querySelectorAll("input:not([type=hidden]), textarea")].some((field) => {
            const visible = field.getClientRects().length > 0 && !field.disabled;
            return visible && field.value.trim() !== "" && field.value !== field.defaultValue;
          });
        } catch {
          return false;
        }
      };

      const getSourceSignature = async () => {
        try {
          const response = await fetch(`./index.html?simulator-check=${Date.now()}`, {
            method: "HEAD",
            cache: "no-store",
            credentials: "same-origin"
          });
          if (!response.ok) return "";
          const parts = [
            response.headers.get("etag") || "",
            response.headers.get("last-modified") || "",
            response.headers.get("content-length") || ""
          ];
          return parts.some(Boolean) ? parts.join("|") : "";
        } catch {
          return "";
        }
      };

      const supportsAutoRefresh = location.protocol === "http:" &&
        ["localhost", "127.0.0.1", "::1", "[::1]"].includes(location.hostname);

      refreshButton.title = defaultRefreshTitle;
      refreshMode.textContent = supportsAutoRefresh
        ? "Автообновление · localhost"
        : location.protocol === "file:"
          ? "file:// · обновляйте вручную"
          : "Для автообновления откройте через localhost";
      refreshButton.addEventListener("click", () => {
        reloadFrame();
        if (supportsAutoRefresh) getSourceSignature().then((signature) => {
          if (signature) sourceSignature = signature;
        });
      });

      const pollForSavedChanges = async () => {
        const signature = await getSourceSignature();
        if (!signature) return;
        if (!sourceSignature) {
          sourceSignature = signature;
          return;
        }
        if (signature === sourceSignature) return;
        if (!safeToReload()) {
          refreshButton.dataset.pending = "true";
          refreshButton.title = "index.html изменён. Сохраните введённое в приложении и нажмите «Обновить».";
          refreshButton.setAttribute("aria-label", "index.html изменён — обновить приложение после сохранения введённого");
          return;
        }

        sourceSignature = signature;
        const controlledByServiceWorker = !!frame.contentDocument?.defaultView?.navigator?.serviceWorker?.controller;
        reloadFrame();
        // The app's service worker serves its saved copy first and refreshes it in the background.
        // A second navigation then picks up the new file without changing the worker or app logic.
        if (controlledByServiceWorker) {
          window.setTimeout(() => {
            if (safeToReload()) reloadFrame();
            else refreshButton.dataset.pending = "true";
          }, 700);
        }
      };

      const simulatorSafeAreaStyle = () => {
        try {
          const frameDocument = frame.contentDocument;
          if (!frameDocument?.head || frameDocument.getElementById("simulator-safe-area-style")) return;

          const style = frameDocument.createElement("style");
          style.id = "simulator-safe-area-style";
          style.textContent = `
            :root {
              --simulator-safe-top: 62px;
              --simulator-safe-bottom: 34px;
              --simulator-safe-left: 0px;
              --simulator-safe-right: 0px;
            }
            @media (orientation: landscape) {
              :root {
                --simulator-safe-top: 0px;
                --simulator-safe-bottom: 0px;
                --simulator-safe-left: 62px;
                --simulator-safe-right: 34px;
              }
            }
            .app {
              padding-top: var(--simulator-safe-top) !important;
              padding-left: var(--simulator-safe-left) !important;
              padding-right: var(--simulator-safe-right) !important;
              background: linear-gradient(var(--sbar), var(--sbar)) top / 100% var(--simulator-safe-top) no-repeat var(--bg) !important;
            }
            .tabs {
              padding-bottom: max(6px, var(--simulator-safe-bottom)) !important;
              padding-left: max(8px, var(--simulator-safe-left)) !important;
              padding-right: max(8px, var(--simulator-safe-right)) !important;
            }
            .wmodal, .zsheet {
              padding-right: calc(16px + var(--simulator-safe-right)) !important;
              padding-bottom: calc(16px + var(--simulator-safe-bottom)) !important;
              padding-left: calc(16px + var(--simulator-safe-left)) !important;
            }
            .wmodal:has(.zform), .wmodal:has(.dperson), .wmodal:has(.bkpanel), .zsheet {
              padding-top: calc(var(--simulator-safe-top) + 16px) !important;
            }
            .sheet-panel { padding-bottom: calc(20px + var(--simulator-safe-bottom)) !important; }
            .zsheet-panel { padding-bottom: calc(20px + var(--simulator-safe-bottom)) !important; }
            #zakatSheet .zsheet-panel { padding-bottom: calc(14px + var(--simulator-safe-bottom)) !important; }
            .sheet-go {
              bottom: calc(-20px - var(--simulator-safe-bottom)) !important;
              margin-bottom: calc(-20px - var(--simulator-safe-bottom)) !important;
              padding-bottom: calc(20px + var(--simulator-safe-bottom)) !important;
            }
            .toast {
              right: calc(16px + var(--simulator-safe-right)) !important;
              bottom: calc(88px + var(--simulator-safe-bottom)) !important;
              left: calc(16px + var(--simulator-safe-left)) !important;
            }
          `;
          frameDocument.head.append(style);
        } catch {
          // The app remains usable if the browser prevents same-origin style access.
        }
      };

      frame.addEventListener("load", simulatorSafeAreaStyle);
      if (frame.contentDocument?.readyState === "complete") simulatorSafeAreaStyle();

      if (supportsAutoRefresh) {
        pollForSavedChanges();
        window.setInterval(pollForSavedChanges, 1800);
      }
    })();
  </script>
</body>
</html>
