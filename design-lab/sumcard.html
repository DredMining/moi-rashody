<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">
<title>Макет · карточка лимита</title>
<!-- Макет для Али (12.11.2026): варианты верхней карточки «Учёта» (лимит месяца и командировочные). Основное приложение (index.html)
     эту страницу не подключает и от неё не зависит. Тёмная тема «Чёрный и бордо». Все суммы — придуманные примеры, не данные Али;
     день месяца берётся сегодняшний. Ничего не сохраняется. -->
<style>
@font-face{font-family:'Golos Text';font-style:normal;font-weight:400;font-display:swap;src:url(../fonts/GolosText-cyrillic-q5uCsoe9Lv.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}

@font-face{font-family:'Golos Text';font-style:normal;font-weight:500;font-display:swap;src:url(../fonts/GolosText-latin-q5uCsoe9Lv.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Golos Text';font-style:normal;font-weight:600;font-display:swap;src:url(../fonts/GolosText-cyrillic-q5uCsoe9Lv.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Golos Text';font-style:normal;font-weight:600;font-display:swap;src:url(../fonts/GolosText-latin-q5uCsoe9Lv.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Golos Text';font-style:normal;font-weight:400;font-display:swap;src:url(../fonts/GolosText-rub400-2626f3c1.woff2) format('woff2');unicode-range:U+20BD}
@font-face{font-family:'Golos Text';font-style:normal;font-weight:500;font-display:swap;src:url(../fonts/GolosText-rub500-1ffbb4e5.woff2) format('woff2');unicode-range:U+20BD}
@font-face{font-family:'Golos Text';font-style:normal;font-weight:600;font-display:swap;src:url(../fonts/GolosText-rub600-48126017.woff2) format('woff2');unicode-range:U+20BD}

/* цвета и размеры — из приложения (тёмная тема) */
:root{
  --bg:#000; --surface:#161215; --inset:#221C20; --raised:#3B3237; --ink:#F7F3F4; --muted:#A79DA2; --field-line:#7A6E74; --track:#4A4046; --seg-ring:#958990; --line:#383035;
  --burgundy:#752238; --burgundy-light:#C34E6C; --accent:var(--burgundy-light);
  --good:#5AD49B; --warn:#F2B950; --bad:#FF7043; --trip:#7A5A1E; --gold:#E0B25A;
  --safe-top:max(env(safe-area-inset-top,0px),var(--simulator-safe-top,0px));
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scrollbar-width:none}
html::-webkit-scrollbar{display:none}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 "Golos Text",system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
main{padding:calc(var(--safe-top) + 8px) 16px 40px;display:flex;flex-direction:column;gap:16px}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:var(--safe-top);background:var(--bg);z-index:15}

/* ---- полоска макета ---- */
.lab{display:flex;flex-direction:column;gap:8px}
.tag{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:3px;background:var(--inset);border:1px solid var(--field-line);border-radius:14px}
.seg button{min-height:38px;border-radius:11px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1.5px var(--seg-ring)}
.why{font-size:13px;line-height:1.45;color:var(--muted)}
.why b{color:var(--ink);font-weight:600}

/* ---- общее для карточек ---- */
.card{position:relative;background:var(--surface);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.caps{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;line-height:1.2;color:var(--muted)}
.tt{position:absolute;top:16px;right:16px;width:32px;height:32px;border:1px solid var(--field-line);border-radius:50%;background:var(--inset);font-size:15px;line-height:1;display:grid;place-items:center}
.big{font-weight:700;font-size:32px;line-height:1.1;letter-spacing:-.01em}
.kop{font-size:.8em;color:var(--muted)}
.good{color:var(--good)}.warnc{color:var(--warn)}
.dotted{text-decoration:underline dotted;text-underline-offset:3px}
.meter{height:4px;border-radius:99px;background:var(--track);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--good)}
.meter.trip i{background:var(--trip)}
.plate{border-radius:14px;background:var(--inset)}
.muted{color:var(--muted)}

/* ---- сейчас ---- */
.now .lhead{display:flex;align-items:center;gap:14px}
.ring{--p:0;--rc:var(--good);flex:none;width:103px;height:103px;border-radius:50%;background:conic-gradient(var(--rc) calc(var(--p) * 1%),var(--track) 0);display:grid;place-items:center}
.ring>div{width:83px;height:83px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.ring b{font-size:25px;font-weight:700}
.now .lr{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.now .lr .caps{padding-right:34px}
.now .lof{display:flex;justify-content:space-between;gap:4px 8px;flex-wrap:wrap;padding:4px 8px;font-size:12px;line-height:1.25;color:var(--muted)}
.now .lrow{display:flex;justify-content:space-between;align-items:baseline;padding:4px 8px;font-size:11px;line-height:1.2;color:var(--muted)}
.now .lrow b{font-size:12px;font-weight:500;color:var(--ink)}
.now .trip{display:flex;flex-direction:column;gap:4px;padding:7px 10px}
.thead,.tfoot{display:flex;justify-content:space-between;align-items:baseline;gap:2px 8px;flex-wrap:wrap;font-size:12px;line-height:1.2;color:var(--muted)}
.thead b{color:var(--ink);font-weight:600;font-size:13px}
.tfoot b{font-weight:500;color:var(--ink)}
.tfoot b.good{color:var(--good)}

/* ---- А: остаток крупно ---- */
.va .caps{padding-right:34px}
.va .sub{font-size:14px;color:var(--muted);margin-top:-4px}
.va .sub b{color:var(--ink);font-weight:600}
.bar{position:relative;height:8px;border-radius:99px;background:var(--track)}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--good)}
/* отметка «сегодня»: сколько по плану должно быть потрачено к этому дню */
.bar>u{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:1px;background:var(--ink)}
.va .row{display:flex;justify-content:space-between;gap:4px 10px;flex-wrap:wrap;font-size:12px;line-height:1.3;color:var(--muted)}
.va .row b{color:var(--ink);font-weight:500}
.tripc{display:flex;flex-direction:column;gap:6px;padding:10px 12px}
.tripc .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;line-height:1.2}
.tripc .top b{font-weight:600}
.tripc .top span{color:var(--muted);font-size:12px}
.tripc .top span b{color:var(--good);font-size:14px}

/* ---- Б: кольцо и столбик цифр ---- */
.vb .lhead{display:flex;align-items:center;gap:16px}
.vb .ring{width:116px;height:116px}
.vb .ring>div{width:96px;height:96px}
.vb .ring small{font-size:11px;color:var(--muted);letter-spacing:.02em}
.vb .ring b{font-size:19px;color:var(--good);margin:2px 0 1px}
.vb .ring em{font-style:normal;font-size:11px;color:var(--muted)}
.vb .tbl{flex:1;min-width:0;display:grid;gap:7px;padding-top:4px}
.vb .tbl div{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;color:var(--muted);line-height:1.2}
.vb .tbl b{font-weight:600;color:var(--ink);font-size:15px}
.vb .tbl div+div{padding-top:7px;border-top:1px solid var(--line)}
.vb .caps{padding-right:34px}

/* ---- В: две плитки ---- */
.vc .head{display:flex;justify-content:space-between;align-items:center;min-height:32px}
.vc .tt{position:static}
.vc .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vc .tile{display:flex;flex-direction:column;gap:6px;padding:12px}
.vc .tile .caps{font-size:11px}
.vc .tile .lft{font-size:11px;color:var(--muted);margin-bottom:-6px}
.vc .tile .sum{font-weight:700;font-size:22px;line-height:1.15;letter-spacing:-.01em}
.vc .tile .of{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.vc .foot{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:0 4px}
.vc .foot b{color:var(--ink);font-weight:500}

/* ---- Г: темп по дням ---- */
.vd .caps{padding-right:34px}
.vd .bigline{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.vd .bigline span{font-size:15px;color:var(--muted)}
.vd .bar{height:10px;margin-top:4px}
.vd .ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:-4px;position:relative;height:14px}
.vd .ticks u{position:absolute;transform:translateX(-50%);text-decoration:none;color:var(--ink)}
.vd .pace{display:flex;align-items:center;gap:10px;padding:10px 12px;font-size:13px;line-height:1.3}
.vd .pace i{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:15px;background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.vd .pace.slow i{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.vd .pace b{font-weight:600}
.vd .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:0 2px}
.vd .row b{color:var(--ink);font-weight:500}

/* ---- Д (ChatGPT «Финансовый поток»): одна составная полоса ---- */
.ve .caps{padding-right:34px}
.ve .flow{display:flex;gap:4px;height:14px;margin-top:4px}
.ve .flow i{border-radius:99px}
.ve .flow .sp{background:var(--burgundy-light)}
.ve .flow .lf{background:var(--good)}
.ve .flow .out{background:repeating-linear-gradient(135deg,var(--muted) 0 3px,transparent 3px 6px);opacity:.7}
.ve .legend{display:grid;grid-template-columns:repeat(3,auto);justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);line-height:1.25}
.ve .legend span{display:flex;flex-direction:column;gap:2px}
.ve .legend b{font-size:15px;font-weight:600;color:var(--ink)}
.ve .legend s{text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.ve .legend s::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}

/* ---- Е (ChatGPT «Финансовый паспорт»): только типографика ---- */
.vf .caps{padding-right:34px}
.vf .of{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:-4px}
.vf hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.vf .ln{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.vf .ln span{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.vf .ln b{font-size:16px;font-weight:600}
.vf .ln b small{font-size:12px;font-weight:400;color:var(--muted);margin-left:4px}

/* ---- Ж (ChatGPT «Два источника»): два раздела разного веса ---- */
.vg .caps{padding-right:34px}
.vg .sub{font-size:13px;color:var(--muted);margin-top:-4px}
.vg .sub b{color:var(--ink);font-weight:500}
.vg .meter i{background:var(--burgundy-light)}
.vg .small{font-size:12px;color:var(--muted)}
.vg .tr{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:14px;background:color-mix(in srgb,var(--gold) 9%,var(--inset))}
.vg .tr .caps{color:var(--gold);padding:0}
.vg .tr .mid{font-weight:700;font-size:22px;line-height:1.15}

/* ---- З (ChatGPT «Циферблат»): дуга с делениями, как у прибора ---- */
.vh .caps{padding-right:34px}
.vh .dial{position:relative;width:100%;max-width:300px;margin:0 auto}
.vh .dial svg{display:block;width:100%;height:auto;overflow:visible}
.vh .dial .mid{position:absolute;left:0;right:0;bottom:2px;display:flex;flex-direction:column;align-items:center;gap:2px}
.vh .dial .mid .big{font-size:30px}
.vh .dial .mid small{font-size:12px;color:var(--muted)}
.vh .ends{display:flex;justify-content:space-between;max-width:300px;width:100%;margin:-4px auto 0;font-size:11px;color:var(--muted)}
.vh .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;font-size:13px}
.vh .foot .ti{display:flex;align-items:center;gap:8px}
.vh .foot .ti svg{width:34px;height:20px;overflow:visible}
.vh .foot b{font-weight:600;color:var(--gold)}
.vh .out{font-size:12px;color:var(--muted);text-align:center}

/* ---- И (ChatGPT «Билет»): билет с перфорацией и золотистый талон ---- */
.vi{gap:0;padding:0;background:none}
.vi .tk{position:relative;background:var(--surface);border-radius:20px;padding:16px}
.vi .tk .caps{padding-right:34px}
.vi .main{display:flex;justify-content:space-between;align-items:stretch;gap:12px;margin-top:10px}
.vi .main .l{display:flex;flex-direction:column;gap:2px}
.vi .main small{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.vi .main .r{display:flex;flex-direction:column;justify-content:center;gap:2px;padding-left:14px;border-left:1px dashed var(--track);text-align:right}
.vi .main .r b{font-size:17px;font-weight:600}
/* перфорация: пунктир и два полукруглых выреза по краям */
.vi .perf{position:relative;height:22px;margin:12px -16px}
.vi .perf::before{content:"";position:absolute;left:18px;right:18px;top:50%;border-top:2px dashed var(--track)}
.vi .perf i{position:absolute;top:0;width:22px;height:22px;border-radius:50%;background:var(--bg)}
.vi .perf i:first-child{left:-11px}.vi .perf i:last-child{right:-11px}
.vi .low{display:flex;justify-content:space-between;font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.vi .low b{color:var(--ink);letter-spacing:0;font-size:14px}
.vi .stub{position:relative;margin-top:8px;padding:12px 16px;border-radius:16px;background:color-mix(in srgb,var(--gold) 14%,var(--surface));display:flex;justify-content:space-between;align-items:center}
.vi .stub span{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--gold)}
.vi .stub b{font-size:18px;font-weight:700}
.vi .stub small{display:block;font-size:11px;color:var(--muted);text-align:right;font-weight:400}
.vi .tt{top:16px;right:16px;z-index:1}

/* ---- К (ChatGPT «Переключатель»): свайп между личным и командировочными ---- */
.vk{overflow:hidden}
.vk .sw{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px}
.vk .sw::-webkit-scrollbar{display:none}
.vk .sl{flex:0 0 100%;scroll-snap-align:start;padding:0 16px;display:flex;flex-direction:column;gap:8px}
.vk .sl .caps{padding-right:34px}
.vk .sl .two{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.vk .sl .two b{display:block;font-size:15px;font-weight:600;color:var(--ink)}
.vk .sl .two span:last-child{text-align:right}
.vk .sl.trip .caps{color:var(--gold)}
.vk .dots{display:flex;justify-content:center;gap:6px}
.vk .dots button{width:7px;height:7px;border-radius:50%;background:var(--track)}
.vk .dots button[aria-current="true"]{background:var(--ink);width:18px;border-radius:4px}

/* ---- Л (ChatGPT «Живое состояние»): вид меняется по ходу месяца ---- */
.vl{--st:var(--good);background:radial-gradient(120% 120% at 100% 0%,color-mix(in srgb,var(--st) 22%,var(--surface)),var(--surface) 62%)}
.vl .caps{padding-right:34px;color:var(--st)}
.vl .msg{font-size:13px;color:var(--muted);margin-top:-4px}
.vl .meter i{background:var(--st)}
.vl .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.vl .row b{color:var(--ink);font-weight:500}
.states{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:10px}
.states button{min-height:34px;border-radius:10px;font-size:12px;color:var(--muted);background:var(--inset);line-height:1.15;padding:2px}
.states button[aria-pressed="true"]{color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--seg-ring)}

/* ---- М (ChatGPT «Компактный»): три строки, подробности по нажатию ---- */
.vm{gap:4px;padding:14px 16px;cursor:pointer}
.vm .caps{font-size:11px;padding-right:34px}
.vm .tt{top:12px;right:12px;width:28px;height:28px;font-size:13px}
.vm .ln1{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.vm .ln1 .big{font-size:28px}
.vm .ln1 .rt{font-size:12px;color:var(--muted);text-align:right;line-height:1.3}
.vm .ln1 .rt b{color:var(--ink);font-weight:500}
.vm .ln2{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);padding-top:6px;border-top:1px solid var(--line);margin-top:4px}
.vm .ln2 b{color:var(--gold);font-weight:600}
.vm .more{display:none;justify-content:space-between;font-size:12px;color:var(--muted)}
.vm .more b{color:var(--ink);font-weight:500}
.vm.open .more{display:flex}
.vm .hint{font-size:11px;color:var(--muted);text-align:center;opacity:.7}

/* ---- Н: столбик на каждый день месяца ---- */
.vn .caps{padding-right:34px}
.vn .sub{font-size:13px;color:var(--muted);margin-top:-4px}
.vn .days{position:relative;display:flex;align-items:flex-end;gap:2px;height:64px;padding-top:4px}
.vn .days i{flex:1;border-radius:2px 2px 0 0;background:var(--burgundy-light);min-height:2px}
.vn .days i.f{background:none;border:1px dashed var(--track);border-bottom:0;height:8px}
.vn .days i.t{background:var(--ink)}
.vn .days u{position:absolute;left:0;right:0;border-top:1px dashed var(--good)}
.vn .ax{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:-6px}
.vn .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.vn .row b{color:var(--ink);font-weight:500}

/* ---- О: батарейка ---- */
.vo .caps{padding-right:34px}
.vo .hd{display:flex;align-items:center;justify-content:space-between;gap:12px}
.bat{display:flex;align-items:center}
.bat .b{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;width:130px;height:40px;padding:4px;border:2px solid var(--muted);border-radius:9px}
.bat .b i{border-radius:3px;background:var(--track)}
.bat .b i.on{background:var(--good)}
.bat::after{content:"";width:4px;height:14px;margin-left:2px;border-radius:0 3px 3px 0;background:var(--muted)}
.bat.sm .b{width:70px;height:22px;padding:2px;gap:2px;border-width:1.5px;border-radius:6px}
.bat.sm .b i{border-radius:2px}
.bat.sm .b i.on{background:var(--gold)}
.bat.sm::after{height:8px;width:3px}
.vo .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.vo .row b{color:var(--ink);font-weight:500}
.vo .tr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;font-size:13px}
.vo .tr b{color:var(--gold);font-weight:600}

/* ---- П: две банковские карты стопкой ---- */
.vp{padding:0;background:none;gap:0}
.vp .tt{z-index:2;top:14px;right:14px}
.vp .bk{position:relative;border-radius:20px;padding:14px 16px}
.vp .back{height:70px;background:linear-gradient(135deg,#8A6A2A,#4A3712);display:flex;justify-content:space-between;align-items:flex-start;padding-right:60px}
.vp .back span{font-size:11px;font-weight:600;letter-spacing:.06em;color:#F3DFAE}
.vp .back b{font-size:16px;font-weight:700;color:#FFF6DF}
.vp .front{margin-top:-30px;min-height:170px;background:linear-gradient(135deg,#8E2B46,#752238 45%,#3D1220);box-shadow:0 -6px 18px rgb(0 0 0 / .45);display:flex;flex-direction:column;gap:6px}
.vp .front .caps{color:#F1C9D3}
.vp .front .chip{width:34px;height:26px;border-radius:6px;background:linear-gradient(135deg,#E8D49A,#A8884A);opacity:.9}
.vp .front .big{color:#fff}
.vp .front .lo{display:flex;justify-content:space-between;margin-top:auto;font-size:12px;color:#F1C9D3}
.vp .front .lo b{color:#fff;font-weight:600}

/* ---- Р: одна фраза крупно ---- */
.vr .caps{padding-right:34px}
.vr .ph{font-size:24px;font-weight:600;line-height:1.3;letter-spacing:-.01em}
.vr .ph em{font-style:normal;color:var(--good)}
.vr .sm{font-size:12px;color:var(--muted)}
.vr .tp{font-size:15px;line-height:1.35;padding:10px 12px}
.vr .tp em{font-style:normal;color:var(--gold);font-weight:600}

/* ---- С: стакан, который пустеет ---- */
.vs .wrap2{display:flex;gap:16px;align-items:stretch}
.vs .glass{position:relative;flex:none;width:58px;height:150px;border:2px solid var(--muted);border-top:0;border-radius:0 0 16px 16px;overflow:hidden}
.vs .glass i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,color-mix(in srgb,var(--good) 80%,#fff),var(--good))}
.vs .glass s{position:absolute;left:0;width:10px;border-top:1px solid var(--muted)}
.vs .glass.g{width:34px;height:72px;border-radius:0 0 10px 10px}
.vs .glass.g i{background:var(--gold)}
.vs .rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.vs .rt .caps{padding-right:34px}
.vs .rt .ln{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:6px}
.vs .rt .ln b{color:var(--ink);font-weight:500}
.vs .tr{display:flex;gap:12px;align-items:flex-end;padding:10px 12px}
.vs .tr div{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
.vs .tr b{font-size:18px;font-weight:700;color:var(--ink)}
</style>
</head>
<body>
<main>
  <div class="lab">
    <span class="tag">Макет · карточка лимита</span>
    <div class="seg" id="vars" role="group" aria-label="Вариант">
      <button type="button" data-v="now" aria-pressed="true">Сейчас</button>
      <button type="button" data-v="a" aria-pressed="false">А</button>
      <button type="button" data-v="b" aria-pressed="false">Б</button>
      <button type="button" data-v="c" aria-pressed="false">В</button>
      <button type="button" data-v="d" aria-pressed="false">Г</button>
      <button type="button" data-v="e" aria-pressed="false">Д</button>
      <button type="button" data-v="f" aria-pressed="false">Е</button>
      <button type="button" data-v="g" aria-pressed="false">Ж</button>
      <button type="button" data-v="h" aria-pressed="false">З</button>
      <button type="button" data-v="i" aria-pressed="false">И</button>
      <button type="button" data-v="k" aria-pressed="false">К</button>
      <button type="button" data-v="l" aria-pressed="false">Л</button>
      <button type="button" data-v="m" aria-pressed="false">М</button>
      <button type="button" data-v="n" aria-pressed="false">Н</button>
      <button type="button" data-v="o" aria-pressed="false">О</button>
      <button type="button" data-v="p" aria-pressed="false">П</button>
      <button type="button" data-v="r" aria-pressed="false">Р</button>
      <button type="button" data-v="s" aria-pressed="false">С</button>
    </div>
  </div>
  <div id="card"></div>
  <p class="why" id="why"></p>
  <p class="why">Суммы на макете — придуманные примеры, день месяца — сегодняшний. Кнопка ☀️ (смена вида) везде осталась на месте; её можно вообще убрать из этой карточки — это отдельный вопрос.</p>
</main>

<script>
'use strict';
const $=id=>document.getElementById(id);
/* придуманные числа: лимит 30 000, потрачено 11 350, вне лимита 1 250; командировочные 28 500, потрачено 12 340,50 */
const LIMIT=3000000, SPENT=1135000, OUT=125000, TRIP=2850000, TSPENT=1234050; /* в копейках */
const now=new Date(), day=now.getDate(), dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(), left=dim-day+1;
const MONTHS=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const sp=' ';
const rub=(k,kop=true)=>{const neg=k<0;k=Math.abs(k);const r=Math.floor(k/100), c=k%100, s=String(r).replace(/\B(?=(\d{3})+(?!\d))/g,sp);
  return (neg?'−':'')+s+(kop?','+String(c).padStart(2,'0'):'')+sp+'₽'};
const rubK=k=>{const r=Math.floor(k/100), c=k%100;return String(r).replace(/\B(?=(\d{3})+(?!\d))/g,sp)+`<span class="kop">,${String(c).padStart(2,'0')}</span>${sp}₽`};
const pct=Math.round(SPENT/LIMIT*100), tpct=Math.round(TSPENT/TRIP*100), rest=LIMIT-SPENT, trest=TRIP-TSPENT;
const perDay=Math.floor(rest/left/100)*100, plan=Math.round(LIMIT*day/dim), ahead=plan-SPENT, planPct=day/dim*100;
const days=n=>n%10===1&&n%100!==11?'день':[2,3,4].includes(n%10)&&![12,13,14].includes(n%100)?'дня':'дней';
const TT='<button type="button" class="tt" aria-label="Смена вида">☀️</button>';

const V={
  now:{why:'<b>Сейчас.</b> Кольцо с процентом, потраченная сумма крупно, «из … / осталось» и «Вне лимита» — две плашки, ниже командировочные со своей полоской.',
    html:`<section class="card now">${TT}<div class="lhead"><div class="ring" style="--p:${pct}"><div><b>${pct}%</b></div></div>
      <div class="lr"><span class="caps">Траты в лимит за месяц</span><span class="big">${rub(SPENT)}</span>
      <span class="lof plate"><span class="dotted">из ${rub(LIMIT,false)}</span><span class="good">осталось ${rub(rest)}</span></span>
      <div class="lrow plate"><span>Вне лимита</span><b>${rub(OUT,false)}</b></div></div></div>
      <div class="trip plate"><div class="thead"><b>🧳 Командировочные</b><span>выдано ${rub(TRIP,false)}</span></div>
      <div class="meter trip"><i style="width:${tpct}%"></i></div>
      <div class="tfoot"><span>потрачено <b>${rubK(TSPENT)}</b></span><span>осталось <b class="good">${rubK(trest)}</b></span></div></div></section>`},
  a:{why:'<b>А — главное число: сколько ещё можно.</b> Крупно — остаток лимита, под ним — сколько в день до конца месяца. Полоса вместо кольца, белая чёрточка на ней — где ты должен быть сегодня по плану. Потрачено и «вне лимита» — одной мелкой строкой. Командировочные — одна строка «осталось» и тонкая полоса.',
    html:`<section class="card va">${TT}<span class="caps">Можно потратить до конца месяца</span><span class="big">${rub(rest)}</span>
      <span class="sub">≈ <b>${rub(perDay,false)}</b> в день · ещё ${left} ${days(left)}</span>
      <div class="bar"><i style="width:${pct}%"></i><u style="left:${planPct}%"></u></div>
      <div class="row"><span>потрачено <b>${rub(SPENT)}</b> из <span class="dotted">${rub(LIMIT,false)}</span></span><span>вне лимита <b>${rub(OUT,false)}</b></span></div>
      <div class="tripc plate"><div class="top"><b>🧳 Командировочные</b><span>осталось <b>${rubK(trest)}</b></span></div>
      <div class="meter trip"><i style="width:${tpct}%"></i></div><div class="top"><span>потрачено ${rub(TSPENT)} из ${rub(TRIP,false)}</span></div></div></section>`},
  b:{why:'<b>Б — кольцо, а цифры столбиком.</b> Кольцо крупнее, внутри — сколько осталось. Справа ровная таблица: потрачено, лимит, вне лимита — каждая цифра на своей строке, без плашек. Командировочные — такой же строкой с полосой.',
    html:`<section class="card vb">${TT}<span class="caps">Лимит · ${MONTHS[now.getMonth()]}</span>
      <div class="lhead"><div class="ring" style="--p:${pct}"><div><small>осталось</small><b>${rub(rest,false)}</b><em>${pct}% потрачено</em></div></div>
      <div class="tbl"><div><span>Потрачено</span><b>${rub(SPENT)}</b></div><div><span class="dotted">Лимит</span><b>${rub(LIMIT,false)}</b></div><div><span>Вне лимита</span><b>${rub(OUT,false)}</b></div></div></div>
      <div class="tripc plate"><div class="top"><b>🧳 Командировочные</b><span>осталось <b>${rubK(trest)}</b></span></div>
      <div class="meter trip"><i style="width:${tpct}%"></i></div><div class="top"><span>потрачено ${rub(TSPENT)} из ${rub(TRIP,false)}</span></div></div></section>`},
  c:{why:'<b>В — две равные плитки.</b> Слева личный лимит, справа командировочные — одинаково устроены: «осталось» крупно, полоса, «из …» и процент. Обе цифры видно сразу, без строк мелкого текста. «Вне лимита» — строкой снизу.',
    html:`<section class="card vc"><div class="head"><span class="caps">${MONTHS[now.getMonth()]}</span>${TT}</div>
      <div class="tiles"><div class="tile plate"><span class="caps">Личное</span><span class="lft">осталось</span><span class="sum">${rub(rest,false)}</span>
        <div class="meter"><i style="width:${pct}%"></i></div><div class="of"><span class="dotted">из ${rub(LIMIT,false)}</span><span>${pct}%</span></div></div>
      <div class="tile plate"><span class="caps">🧳 Командировка</span><span class="lft">осталось</span><span class="sum">${rub(trest,false)}</span>
        <div class="meter trip"><i style="width:${tpct}%"></i></div><div class="of"><span>из ${rub(TRIP,false)}</span><span>${tpct}%</span></div></div></div>
      <div class="foot"><span>Вне лимита</span><b>${rub(OUT,false)}</b></div></section>`},
  d:{why:'<b>Г — как сейчас, но с темпом.</b> Потрачено крупно, под ним полоса месяца с отметкой «сегодня». Ниже подсказка: идёшь ли по плану и сколько можно в день. Это новый расчёт: остаток делится на оставшиеся дни, план — лимит, поделённый на дни месяца.',
    html:`<section class="card vd">${TT}<span class="caps">Траты в лимит за месяц</span>
      <div class="bigline"><span class="big">${rub(SPENT)}</span><span>из <span class="dotted">${rub(LIMIT,false)}</span></span></div>
      <div class="bar"><i style="width:${pct}%"></i><u style="left:${planPct}%"></u></div>
      <div class="ticks"><span>1</span><u style="left:${planPct}%">сегодня</u><span>${dim}</span></div>
      <div class="pace plate${ahead<0?' slow':''}"><i>${ahead<0?'!':'✓'}</i><span>${ahead>=0?`Идёшь по плану, запас <b>${rub(ahead,false)}</b>.`:`Быстрее плана на <b>${rub(-ahead,false)}</b>.`} Можно ≈ <b>${rub(perDay,false)}</b> в день.</span></div>
      <div class="row"><span>осталось <b class="good">${rub(rest)}</b></span><span>вне лимита <b>${rub(OUT,false)}</b></span></div>
      <div class="tripc plate"><div class="top"><b>🧳 Командировочные</b><span>осталось <b>${rubK(trest)}</b></span></div>
      <div class="meter trip"><i style="width:${tpct}%"></i></div><div class="top"><span>потрачено ${rub(TSPENT)} из ${rub(TRIP,false)}</span></div></div></section>`},
  e:{why:'<b>Д — «Финансовый поток» (идея ChatGPT).</b> Крупно — весь лимит месяца. Под ним одна толстая полоса: бордовым — потрачено, зелёным — осталось, штриховкой отдельно — вне лимита. Под полосой три цифры с цветными точками. Кольца и плашек нет.',
    html:`<section class="card ve">${TT}<span class="caps">Личный лимит · ${MONTHS[now.getMonth()]}</span><span class="big dotted">${rub(LIMIT,false)}</span>
      <div class="flow"><i class="sp" style="flex:${SPENT}"></i><i class="lf" style="flex:${rest}"></i><i class="out" style="flex:0 0 ${Math.max(14,Math.round(OUT/LIMIT*340))}px"></i></div>
      <div class="legend"><span><s style="--c:var(--burgundy-light)">потрачено</s><b>${rub(SPENT,false)}</b></span><span><s style="--c:var(--good)">осталось</s><b>${rub(rest,false)}</b></span><span><s style="--c:var(--muted)">вне лимита</s><b>${rub(OUT,false)}</b></span></div>
      <div class="tripc plate"><div class="top"><b>🧳 Командировочные</b><span>осталось <b>${rubK(trest)}</b></span></div>
      <div class="meter trip"><i style="width:${tpct}%"></i></div></div></section>`},
  f:{why:'<b>Е — «Финансовый паспорт» (идея ChatGPT).</b> Одни цифры, без колец, полос и плашек. Крупно — доступный остаток, под ним «из 30 000 · ноябрь». Дальше ровные строки капсом через тонкие линии: потрачено, вне лимита, командировочные. Спокойно и строго.',
    html:`<section class="card vf">${TT}<span class="caps">Доступно</span><span class="big">${rub(rest)}</span><span class="of"><span class="dotted">из ${rub(LIMIT,false)}</span> · ${MONTHS[now.getMonth()]}</span>
      <hr><div class="ln"><span>Потрачено</span><b>${rub(SPENT)}</b></div><div class="ln"><span>Вне лимита</span><b>${rub(OUT,false)}</b></div>
      <hr><div class="ln"><span>🧳 Командировочные</span><b class="good">${rubK(trest)}<small>из ${rub(TRIP,false)}</small></b></div></section>`},
  g:{why:'<b>Ж — «Два источника» (идея ChatGPT).</b> Одна карточка, два раздела разного веса. Сверху главный — личные: остаток крупно, «потрачено из лимита», бордовая полоса. Снизу командировочные на золотистой подложке: остаток поменьше, «из 28 500». Сразу видно, где чьи деньги.',
    html:`<section class="card vg">${TT}<span class="caps">Личные · ${MONTHS[now.getMonth()]}</span><span class="big">${rub(rest)}</span>
      <span class="sub">потрачено <b>${rub(SPENT)}</b> из <span class="dotted">${rub(LIMIT,false)}</span></span>
      <div class="meter"><i style="width:${pct}%"></i></div><span class="small">вне лимита ${rub(OUT,false)}</span>
      <div class="tr"><span class="caps">🧳 Командировочные</span><span class="mid">${rubK(trest)}</span><span class="small">остаток из ${rub(TRIP,false)} · потрачено ${rub(TSPENT)}</span>
      <div class="meter trip"><i style="width:${tpct}%"></i></div></div></section>`},
  h:{why:'<b>З — «Циферблат» (идея ChatGPT).</b> Вместо кольца — дуга с делениями, как у стрелочного прибора: бордовым — сколько уже потрачено, белая точка — где ты сейчас. Внутри дуги крупно остаток. Командировочные — строка с маленькой золотой дугой.',
    html:()=>`<section class="card vh">${TT}<span class="caps">Доступно в ${MONTHS_IN[now.getMonth()]}</span>
      <div class="dial">${dial(SPENT/LIMIT,'var(--burgundy-light)',true)}<div class="mid"><span class="big">${rub(rest,false)}</span><small>потрачено ${rub(SPENT)}</small></div></div>
      <div class="ends"><span>0</span><span class="dotted">${rub(LIMIT,false)}</span></div>
      <div class="foot plate"><span class="ti"><svg viewBox="0 0 240 132" aria-hidden="true">${dial(TSPENT/TRIP,'var(--gold)',false,true)}</svg>🧳 Командировочные</span><span>осталось <b>${rubK(trest)}</b></span></div>
      <span class="out">вне лимита ${rub(OUT,false)}</span></section>`},
  i:{why:'<b>И — «Билет» (идея ChatGPT).</b> Карточка как билет: сверху остаток крупно и лимит в отдельной колонке, ниже линия отрыва с вырезами, под ней потрачено и вне лимита. Командировочные — отдельный золотистый «талон».',
    html:()=>`<section class="card vi">${TT}<div class="tk"><span class="caps">${MONTHS[now.getMonth()]} ${now.getFullYear()} · личный бюджет</span>
      <div class="main"><div class="l"><small>ОСТАЛОСЬ</small><span class="big">${rub(rest,false)}</span></div><div class="r"><small>ЛИМИТ</small><b class="dotted">${rub(LIMIT,false)}</b></div></div>
      <div class="perf"><i></i><i></i></div>
      <div class="low"><span>ПОТРАЧЕНО <b>${rub(SPENT)}</b></span><span>ВНЕ ЛИМИТА <b>${rub(OUT,false)}</b></span></div></div>
      <div class="stub"><div><span>🧳 КОМАНДИРОВОЧНЫЕ</span></div><div><b>${rubK(trest)}</b><small>доступно из ${rub(TRIP,false)}</small></div></div></section>`},
  k:{why:'<b>К — «Переключатель» (идея ChatGPT).</b> В карточке одно из двух: личный остаток или командировочные — оба крупно. Листается свайпом вбок (или нажатием на точки снизу). Карточка ниже, чем сейчас, а обе суммы — главные на своём листе.',
    html:()=>`<section class="card vk">${TT}<div class="sw" id="sw">
      <div class="sl"><span class="caps">Личное · осталось</span><span class="big">${rub(rest)}</span><div class="meter"><i style="width:${pct}%"></i></div>
        <div class="two"><span>потрачено<b>${rub(SPENT)}</b></span><span><span class="dotted">лимит</span><b>${rub(LIMIT,false)}</b></span></div></div>
      <div class="sl trip"><span class="caps">🧳 Осталось на поездку</span><span class="big">${rubK(trest)}</span><div class="meter trip"><i style="width:${tpct}%"></i></div>
        <div class="two"><span>выдано<b>${rub(TRIP,false)}</b></span><span>потрачено<b>${rub(TSPENT)}</b></span></div></div></div>
      <div class="dots"><button type="button" data-go="0" aria-current="true" aria-label="Личное"></button><button type="button" data-go="1" aria-current="false" aria-label="Командировочные"></button></div></section>`,
    after(){const sw=$('sw'), dots=[...document.querySelectorAll('.vk .dots button')];
      sw.addEventListener('scroll',()=>{const i=Math.round(sw.scrollLeft/sw.clientWidth);dots.forEach((d,j)=>d.setAttribute('aria-current',String(i===j)))},{passive:true});
      dots.forEach(d=>d.addEventListener('click',()=>sw.scrollTo({left:+d.dataset.go*sw.clientWidth,behavior:'smooth'})))}},
  l:{why:'<b>Л — «Живое состояние» (идея ChatGPT).</b> Подпись, крупная цифра, фраза и цвет подсветки меняются по ходу месяца: в начале — «бюджет доступен», обычно — «можно потратить», под конец — «осталось до лимита», при перерасходе — «превышение» с минусом. Кнопки под карточкой переключают состояния.',
    html:()=>{const s=ST[st], r=LIMIT-s.sp, p=Math.min(100,Math.round(s.sp/LIMIT*100));
      return `<section class="card vl" style="--st:${s.c}">${TT}<span class="caps">${s.lbl}</span><span class="big">${rub(r)}</span><span class="msg">${s.msg}</span>
      <div class="meter"><i style="width:${p}%"></i></div><div class="row"><span>потрачено <b>${rub(s.sp)}</b> из <span class="dotted">${rub(LIMIT,false)}</span></span><span>вне лимита <b>${rub(OUT,false)}</b></span></div>
      <div class="tripc plate"><div class="top"><b>🧳 Командировочные</b><span>осталось <b>${rubK(trest)}</b></span></div><div class="meter trip"><i style="width:${tpct}%"></i></div></div></section>
      <div class="states">${Object.keys(ST).map(k=>`<button type="button" data-st="${k}" aria-pressed="${k===st}">${ST[k].btn}</button>`).join('')}</div>`}},
  m:{why:'<b>М — «Компактный» (идея ChatGPT).</b> Три строки: остаток крупно, справа мелко потрачено и лимит, ниже командировочные. Карточка почти вдвое ниже, освобождает место под «Новую запись». «Вне лимита» открывается нажатием на карточку.',
    html:()=>`<section class="card vm" id="cm">${TT}<span class="caps">Личный остаток</span>
      <div class="ln1"><span class="big">${rub(rest)}</span><span class="rt"><b>${rub(SPENT,false)}</b> потрачено<br><b class="dotted">${rub(LIMIT,false)}</b> лимит</span></div>
      <div class="more"><span>вне лимита</span><b>${rub(OUT,false)}</b></div>
      <div class="ln2"><span>🧳 командировочные</span><b>${rubK(trest)}</b></div></section>`,
    after(){$('cm').addEventListener('click',e=>{if(!e.target.closest('.tt'))$('cm').classList.toggle('open')})}},
  n:{why:'<b>Н — столбик на каждый день.</b> Крупно остаток, под ним маленький график месяца: столбик — сколько потрачено в этот день, белый — сегодня, пунктир — будущие дни. Зелёная пунктирная линия — сколько можно в день, чтобы уложиться. Сразу видно дорогие дни.',
    html:()=>{const a=daily(), mx=Math.max(...a, LIMIT/dim*1.2), pl=LIMIT/dim/mx*60;
      return `<section class="card vn">${TT}<span class="caps">Осталось на ${MONTHS[now.getMonth()]}</span><span class="big">${rub(rest)}</span><span class="sub">≈ ${rub(perDay,false)} в день до конца месяца</span>
      <div class="days">${Array.from({length:dim},(_,i)=>i<day?`<i class="${i===day-1?'t':''}" style="height:${Math.max(2,a[i]/mx*60).toFixed(1)}px"></i>`:'<i class="f"></i>').join('')}<u style="bottom:${pl.toFixed(1)}px"></u></div>
      <div class="ax"><span>1</span><span>${dim}</span></div>
      <div class="row"><span>потрачено <b>${rub(SPENT)}</b> из <span class="dotted">${rub(LIMIT,false)}</span></span><span>вне лимита <b>${rub(OUT,false)}</b></span></div>
      <div class="tripc plate"><div class="top"><b>🧳 Командировочные</b><span>осталось <b>${rubK(trest)}</b></span></div></div></section>`}},
  o:{why:'<b>О — батарейка.</b> Остаток лимита как заряд: десять делений, сколько горит — столько осталось. Рядом крупно сумма. Командировочные — маленькая золотая батарейка. Понятно с одного взгляда, без чтения цифр.',
    html:()=>{const cells=(k,n)=>Array.from({length:10},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('');
      return `<section class="card vo">${TT}<span class="caps">Заряд на ${MONTHS[now.getMonth()]}</span>
      <div class="hd"><span class="big">${rub(rest,false)}</span><span class="bat"><span class="b">${cells(0,Math.round(rest/LIMIT*10))}</span></span></div>
      <div class="row"><span>потрачено <b>${rub(SPENT)}</b> из <span class="dotted">${rub(LIMIT,false)}</span></span><span>вне лимита <b>${rub(OUT,false)}</b></span></div>
      <div class="tr plate"><span>🧳 Командировочные <b>${rubK(trest)}</b></span><span class="bat sm"><span class="b">${cells(0,Math.round(trest/TRIP*10))}</span></span></div></section>`}},
  p:{why:'<b>П — две карты стопкой.</b> Как банковские карты в кошельке: спереди бордовая «Личные» — остаток крупно, внизу потрачено и лимит; сзади выглядывает золотая «Командировочные» с остатком. Сразу видно, что это два разных кошелька.',
    html:()=>`<section class="card vp">${TT}<div class="bk back"><span>🧳 КОМАНДИРОВОЧНЫЕ</span><b>${rub(trest)}</b></div>
      <div class="bk front"><span class="caps">Личные · ${MONTHS[now.getMonth()]}</span><span class="chip"></span><span class="big">${rub(rest)}</span>
      <div class="lo"><span>потрачено <b>${rub(SPENT,false)}</b></span><span>вне лимита <b>${rub(OUT,false)}</b></span><span class="dotted">лимит <b>${rub(LIMIT,false)}</b></span></div></div></section>`},
  r:{why:'<b>Р — одна фраза.</b> Вместо таблички — обычное предложение крупным шрифтом: «Можно потратить ещё 18 650 ₽ — примерно 981 ₽ в день». Всё остальное — одной мелкой строкой. Командировочные — такой же фразой поменьше.',
    html:()=>`<section class="card vr">${TT}<span class="caps">${MONTHS[now.getMonth()]}</span>
      <p class="ph">Можно потратить ещё <em>${rub(rest,false)}</em> — примерно ${rub(perDay,false)} в&nbsp;день до ${dim}-го.</p>
      <span class="sm">потрачено ${rub(SPENT)} из <span class="dotted">${rub(LIMIT,false)}</span> · вне лимита ${rub(OUT,false)}</span>
      <p class="tp plate">🧳 На поездку осталось <em>${rub(trest)}</em> из ${rub(TRIP,false)}.</p></section>`},
  s:{why:'<b>С — стакан.</b> Слева «стакан» с деньгами месяца: чем больше потрачено, тем ниже уровень. Справа крупно остаток и две строки. Командировочные — маленький золотой стакан рядом с суммой.',
    html:()=>{const marks=h=>[.25,.5,.75].map(f=>`<s style="bottom:${(f*h).toFixed(0)}px"></s>`).join('');
      return `<section class="card vs">${TT}<div class="wrap2"><span class="glass"><i style="height:${(rest/LIMIT*100).toFixed(1)}%"></i>${marks(150)}</span>
      <div class="rt"><span class="caps">Осталось</span><span class="big">${rub(rest,false)}</span><span class="ln"><span>потрачено</span><b>${rub(SPENT)}</b></span><span class="ln"><span class="dotted">лимит</span><b>${rub(LIMIT,false)}</b></span><span class="ln"><span>вне лимита</span><b>${rub(OUT,false)}</b></span></div></div>
      <div class="tr plate"><span class="glass g"><i style="height:${(trest/TRIP*100).toFixed(1)}%"></i></span><div><span>🧳 командировочные, осталось</span><b>${rubK(trest)}</b><span>из ${rub(TRIP,false)}</span></div></div></section>`}},
};
/* придуманные траты по дням (для «Н»): разные, в сумме — SPENT за прошедшие дни */
function daily(){const w=Array.from({length:day},(_,i)=>.3+Math.abs(Math.sin((i+1)*12.9898)*43758.5453%1)*(i%6===5?3:1)), s=w.reduce((a,b)=>a+b,0);return w.map(x=>x/s*SPENT)}
/* дуга «Циферблата»: доля p пройденного пути слева направо; деления через каждые 10 % */
function dial(p,color,ticks,bare){p=Math.max(0,Math.min(1,p));const pt=(q,r)=>{const a=Math.PI*(1-q);return [(120+r*Math.cos(a)).toFixed(1),(120-r*Math.sin(a)).toFixed(1)]};
  const [x,y]=pt(p,100);let t='';if(ticks)for(let i=0;i<=10;i++){const [x1,y1]=pt(i/10,112),[x2,y2]=pt(i/10,i%5?117:122);t+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`}
  const g=`<path d="M20 120 A100 100 0 0 1 220 120" style="fill:none;stroke:var(--track);stroke-width:${bare?22:12};stroke-linecap:round"/>`
    +(p>0?`<path d="M20 120 A100 100 0 0 1 ${x} ${y}" style="fill:none;stroke:${color};stroke-width:${bare?22:12};stroke-linecap:round"/>`:'')
    +(ticks?`<g style="stroke:var(--muted);stroke-width:1.5;stroke-linecap:round">${t}</g><circle cx="${x}" cy="${y}" r="6" style="fill:var(--ink)"/>`:'');
  return bare?g:`<svg viewBox="-4 -6 248 132" aria-hidden="true">${g}</svg>`}
const MONTHS_IN=['январе','феврале','марте','апреле','мае','июне','июле','августе','сентябре','октябре','ноябре','декабре'];
/* состояния «Живого»: придуманные траты для каждого */
const ST={start:{btn:'Начало месяца',lbl:'Бюджет доступен',sp:0,msg:'Месяц только начался — весь лимит впереди.',c:'var(--burgundy)'},
  norm:{btn:'Обычно',lbl:'Можно потратить',sp:SPENT,msg:'Идёшь спокойно.',c:'var(--good)'},
  near:{btn:'Близко к лимиту',lbl:'Осталось до лимита',sp:2680000,msg:'Лимит почти исчерпан — осторожнее.',c:'var(--burgundy-light)'},
  over:{btn:'Перерасход',lbl:'Превышение лимита',sp:3125000,msg:'Лимит превышен.',c:'var(--bad)'}};
let st='norm';
function show(v){const x=V[v];$('card').innerHTML=typeof x.html==='function'?x.html():x.html;$('why').innerHTML=x.why;if(x.after)x.after();
  $('vars').querySelectorAll('[data-v]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===v)))}
$('vars').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(b)show(b.dataset.v)});
$('card').addEventListener('click',e=>{const b=e.target.closest('[data-st]');if(b){st=b.dataset.st;show('l')}});
show('now');
</script>
</body>
